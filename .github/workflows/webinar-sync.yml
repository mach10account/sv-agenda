# Ogni 2 ore riallinea dev/webinar.json alla tabella Notion "🎥 WEBINAR".
# I dati arrivano da un webhook n8n, che legge Notion con le credenziali che
# ha già: così in questo repo (pubblico!) non serve nessun segreto — il
# commit usa il GITHUB_TOKEN automatico del job. Committa solo se il
# calendario è davvero cambiato.
name: Calendario webinar da Notion

on:
  schedule:
    - cron: "17 */2 * * *" # ogni 2 ore, al minuto 17: i :00 su GitHub sono affollati e slittano
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: calendario-webinar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica il calendario dal webhook n8n
        run: curl -sS --fail --max-time 60 "https://n8n.srv1035791.hstgr.cloud/webhook/webinar-calendario" -o /tmp/webinar-nuovo.json

      - name: Riallinea dev/webinar.json se è cambiato
        id: diff
        run: python3 .github/scripts/webinar_sync.py

      - name: Committa e pubblica
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/webinar.json
          git commit -m "Calendario webinar riallineato alla tabella Notion"
          git push
          # I push fatti col GITHUB_TOKEN non sempre innescano la build di
          # Pages: la chiediamo esplicitamente, male non fa.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
