<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estetista Indipendente</title>
  <link rel="icon" href="icona.png?v=23">
  <!-- Il numero di versione va alzato a ogni pubblicazione: senza, i browser
       tengono la versione vecchia per dieci minuti. -->
  <link rel="stylesheet" href="styles.css?v=23">
</head>
<body>
  <header id="topbar" hidden>
    <!-- Due file, non due ritagli dello stesso: in colonna c'è spazio per il
       marchio intero con la scritta, in riga a 44 pixel quella scritta non si
       leggerebbe e resta il solo emblema. Due <img> e non un <picture>: il
       browser sceglie la sorgente di picture una volta sola e non la riscambia
       quando la finestra cambia larghezza, quindi un tablet ruotato si terrebbe
       l'immagine sbagliata fino al ricaricamento. Qui sceglie il CSS, che
       ricalcola sempre. -->
  <img id="marchio" class="marchio marchio-intero" src="logo.png?v=23" alt="Estetista Indipendente">
  <img id="marchio-segno" class="marchio marchio-segno" src="icona.png?v=23" alt="Estetista Indipendente">
    <span class="brand"><b>Estetista</b><i>Indipendente</i></span>
    <nav id="tabs" class="tabs"></nav>
    <div class="separa-gruppi"></div>
    <nav id="tabs-servizi" class="tabs tabs-servizi"></nav>
    <button id="stringi" class="stringi" type="button"></button>
  </header>

  <main id="app">
    <div class="loading">Caricamento…</div>
  </main>

  <script type="module" src="app.js?v=23"></script>
</body>
</html>
